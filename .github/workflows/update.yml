name: Publish calendar from canonical Sheet
on:
  push:
    branches: [main]
    paths:
      - 'poetry_calendar/**'
      - 'config/sheet.json'
      - 'site/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validating the Sheet (false performs a build check only)
        type: boolean
        default: true
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/London

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: poetry-calendar-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Read canonical Sheet and build public fields only
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python -m poetry_calendar build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          path: public-site
      - name: Publish
        id: deployment
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/deploy-pages@v4
