name: Refresh poetry calendar
on:
  push:
    branches: [main]
    paths:
      - 'poetry_calendar/**'
      - 'config/**'
      - 'site/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      collect:
        description: Fetch publisher websites (otherwise rebuild only)
        type: boolean
        default: true
  schedule:
    - cron: '17 8 * * 1'
      timezone: Europe/London
    - cron: '17 8 * * 0,2-6'
      timezone: Europe/London

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: poetry-calendar-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Weekly or requested collection
        if: github.event_name == 'push' || github.event.schedule == '17 8 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python -m poetry_calendar collect
      - name: Rebuild from durable state
        run: python -m poetry_calendar build
      - name: Preserve observations before deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if ! git diff --cached --quiet; then
            git commit -m "Refresh poetry calendar and source diagnostics"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Source report
        if: always()
        run: |
          python -m poetry_calendar status >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/review.json ]; then
            echo 'Source warnings are retained in data/review.json in the repository.' >> "$GITHUB_STEP_SUMMARY"
          fi
