<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forthcoming Poetry — a publication calendar</title>
  <meta name="description" content="An editor-maintained calendar of forthcoming poetry from UK and Irish publishers.">
  <link rel="stylesheet" href="style.css?v=press-catalogue">
  <script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#calendar">Skip to the calendar</a>
<header class="masthead">
  <div class="masthead-inner">
    <div>
      <p class="eyebrow">Publication calendar <span aria-hidden="true">·</span> UK &amp; Ireland</p>
      <h1>Forthcoming Poetry</h1>
      <p class="lede">New collections, translations and anthologies.</p>
    </div>
    <div class="edition">
      <p>{{COUNT}} titles <span aria-hidden="true">·</span> {{VISIBLE_PUBLISHERS}} publishers</p>
      <p>Updated <time id="as-of" datetime="{{AS_OF}}">{{UPDATED}}</time></p>
    </div>
  </div>
</header>
<main class="catalogue">
  <div class="filters" role="group" aria-label="Filter the calendar" hidden>
    <label>Month<select id="month"><option value="">All months</option>{{MONTH_OPTIONS}}</select></label>
    <label>Publisher<select id="publisher"><option value="">All publishers</option>{{OPTIONS}}</select></label>
    <label>Format<select id="format"><option value="">All formats</option>{{FORMAT_OPTIONS}}</select></label>
    <p id="filter-count" role="status"></p>
  </div>
  <section id="calendar" aria-label="Publication calendar" tabindex="-1">
    <ol class="calendar">{{BOOKS}}</ol>
    <p id="no-results" hidden>No titles match these filters.</p>
  </section>
</main>
</body>
</html>
